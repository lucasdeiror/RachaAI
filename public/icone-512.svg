<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#27272A" stroke-width="4" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#FACC15" stroke-opacity="0.12" stroke-width="2" />

  <!-- Center Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glow)" />

  <!-- Geometric Pint Glass Left (Tilted Right) -->
  <g transform="translate(195, 270) rotate(-14) translate(-195, -270)">
    <!-- Foam Cap -->
    <path d="M 148 165 C 148 145, 172 142, 185 152 C 195 138, 225 140, 235 154 C 248 144, 268 152, 264 168 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Glass Body -->
    <path d="M 152 170 L 260 170 L 244 340 C 242 355, 230 366, 214 366 L 198 366 C 182 366, 170 355, 168 340 Z" fill="#202026" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-linejoin="round" />
    <!-- Liquid Amber -->
    <path d="M 158 210 L 254 210 L 241 336 C 240 348, 230 356, 218 356 L 194 356 C 182 356, 172 348, 171 336 Z" fill="url(#goldGrad)" fill-opacity="0.85" />
    <!-- Handle -->
    <path d="M 152 205 C 120 210, 115 295, 162 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Geometric Pint Glass Right (Tilted Left) -->
  <g transform="translate(317, 270) rotate(14) translate(-317, -270)">
    <!-- Foam Cap -->
    <path d="M 248 168 C 244 152, 264 144, 277 154 C 287 140, 317 138, 327 152 C 340 142, 364 145, 364 165 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Glass Body -->
    <path d="M 252 170 L 360 170 L 344 340 C 342 355, 330 366, 314 366 L 298 366 C 282 366, 270 355, 268 340 Z" fill="#202026" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-linejoin="round" />
    <!-- Liquid Amber -->
    <path d="M 258 210 L 354 210 L 341 336 C 340 348, 330 356, 318 356 L 294 356 C 282 356, 272 348, 271 336 Z" fill="url(#goldGrad)" fill-opacity="0.85" />
    <!-- Handle -->
    <path d="M 360 205 C 392 210, 397 295, 350 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Division / Lightning Slash Central Strike (The "Racha" Electric Cut) -->
  <g filter="url(#neonGlow)">
    <!-- Diagonal Energy Beam (Division Bar) -->
    <line x1="375" y1="135" x2="137" y2="377" stroke="url(#slashGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Top Division Spark Dot -->
    <circle cx="340" cy="215" r="22" fill="#FACC15" />
    <circle cx="340" cy="215" r="14" fill="#FFFFFF" />

    <!-- Bottom Division Spark Dot -->
    <circle cx="172" cy="297" r="22" fill="#FACC15" />
    <circle cx="172" cy="297" r="14" fill="#FFFFFF" />

    <!-- Center Lightning Clink Sparkle -->
    <polygon points="256,155 264,180 288,188 264,196 256,220 248,196 224,188 248,180" fill="#FFFFFF" />
  </g>

  <!-- Modern Tech Notch / Tagline Indicator -->
  <g transform="translate(256, 435)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FACC15" text-anchor="middle" letter-spacing="3">RACHA<tspan fill="#FFFFFF">AI</tspan></text>
  </g>
</svg>
